releaseNotes: >-
  Version 1.2.3 adds optional effort ratings for weighted sets using either RIR or RPE. Imported Strong and Hevy workouts can now retain existing effort ratings, while blank or invalid values are handled safely. Existing profiles using the earlier RIR option are migrated automatically without rewriting historical workouts.
