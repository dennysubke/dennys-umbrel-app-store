version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: denny-opengym_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  media:
    image: alpine/git:latest
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /out/img /out/gif
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ] || [ -z "$$(ls -A /out/gif 2>/dev/null)" ]; then
          echo "Downloading openGym exercise media..."
          rm -rf /tmp/exercises-dataset
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/exercises-dataset
          cp /tmp/exercises-dataset/images/*.jpg /out/img/
          cp /tmp/exercises-dataset/videos/*.gif /out/gif/
          echo "Exercise media download completed."
        else
          echo "Exercise media already exists."
        fi
    volumes:
      - ${APP_DATA_DIR}/media/img:/out/img
      - ${APP_DATA_DIR}/media/gif:/out/gif
    restart: "no"

  api:
    image: ghcr.io/duartesantos8/opengym-api:1.2.3
    user: "1000:1000"
    environment:
      PORT: "3000"
      DATA_DIR: /data
      RP_ID: ${DEVICE_DOMAIN_NAME}
      ORIGIN: http://${DEVICE_DOMAIN_NAME}:8395
      RP_NAME: openGym
      ADMIN_UIDS: ""
      INVITE_ONLY: "false"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q '\"ok\":true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: on-failure

  web:
    image: ghcr.io/duartesantos8/opengym-web:1.2.3
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/media/img:/usr/share/nginx/html/img:ro
      - ${APP_DATA_DIR}/media/gif:/usr/share/nginx/html/gif:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: on-failure
