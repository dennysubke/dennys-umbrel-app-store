name: Build Bunker46 images

on:
  push:
    branches:
      - master
      - feature/bunker46
    paths:
      - ".github/workflows/build-bunker46-images.yml"
  pull_request:
    paths:
      - ".github/workflows/build-bunker46-images.yml"
      - "denny-bunker46/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REPOSITORY: dsbaars/bunker46
  UPSTREAM_REF: 36a3386b12b306016a07dfc1a44fbeb1e2be0cb1
  IMAGE_VERSION: 0.1.0-36a3386

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: apps/server/Dockerfile
            image: bunker46-server
          - name: web
            dockerfile: apps/web/Dockerfile
            image: bunker46-web

    steps:
      - name: Check out Bunker46 upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REF }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/dennysubke/${{ matrix.image }}:${{ env.IMAGE_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/dennysubke/dennys-umbrel-app-store
            org.opencontainers.image.revision=${{ env.UPSTREAM_REF }}
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
          cache-from: type=gha,scope=bunker46-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=bunker46-${{ matrix.name }}
