name: Verify MoinPDF installation
on:
  push:
    branches: [master]
    paths:
      - 'denny-moinpdf/**'
      - '.github/tests/moinpdf/**'
      - '.github/workflows/moinpdf.yml'
  pull_request:
    paths:
      - 'denny-moinpdf/**'
      - '.github/tests/moinpdf/**'
      - '.github/workflows/moinpdf.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moinpdf-install-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installation:
    name: Umbrel ${{ matrix.installation }} (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        installation: [fresh, upgrade-from-0.14.5]
        architecture: [amd64, arm64]
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Check out the previously published store package
        if: matrix.installation == 'upgrade-from-0.14.5'
        uses: actions/checkout@v4
        with:
          ref: 7e591f730aa1e620665367fb5a1aa89f84d6f0da
          path: upgrade-baseline
          sparse-checkout: denny-moinpdf
      - uses: docker/setup-buildx-action@v3
      - name: Validate installation and browser test syntax
        run: |
          bash -n .github/tests/moinpdf/umbrel-install.sh
          bash -n .github/tests/moinpdf/umbrel-upgrade.sh
          bash -n denny-moinpdf/hooks/pre-start
          python -m py_compile .github/tests/moinpdf/*.py
      - name: Verify job storage setup and existing-file preservation
        run: sudo python .github/tests/moinpdf/job-storage-hook.py
      - name: Verify pinned public images for both architectures
        run: python .github/tests/moinpdf/verify-images.py
      - name: Free disposable runner disk space
        timeout-minutes: 15
        run: |
          # This runner is disposable. Free only preinstalled SDKs not used here.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/powershell /home/runner/.rustup
          docker image prune --all --force
          df -h /
      - name: Install browser test dependencies
        timeout-minutes: 10
        run: |
          python -m pip install playwright==1.55.0 pymupdf==1.28.2 requests==2.34.2
          python -m playwright install --with-deps chromium
      - name: Boot disposable Umbrel test host
        timeout-minutes: 10
        run: |
          # Privilege is limited to the disposable OS test harness. No MoinPDF
          # app container is privileged or has access to a Docker socket.
          docker run -d --name moinpdf-umbrel-test --privileged --network host \
            --cgroupns host --tmpfs /run --tmpfs /run/lock \
            --volume /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --volume moinpdf-umbrel-test:/home/umbrel/umbrel \
            --volume moinpdf-umbrel-docker:/var/lib/docker \
            --volume moinpdf-umbrel-containerd:/var/lib/containerd \
            ghcr.io/getumbrel/umbrelos:2.0.0 /sbin/init
      - name: Install through Umbrel
        env:
          MOINPDF_UPGRADE_FROM: ${{ matrix.installation == 'upgrade-from-0.14.5' && 'upgrade-baseline/denny-moinpdf' || '' }}
        run: bash .github/tests/moinpdf/umbrel-install.sh
      - name: Browser, protected routes, website conversion, translation and restart persistence
        env:
          MOINPDF_TEST_INSTALLATION: ${{ matrix.installation }}
          MOINPDF_TEST_ARCHITECTURE: ${{ matrix.architecture }}
        run: python .github/tests/moinpdf/umbrel-smoke.py
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umbrel-verification-${{ matrix.installation }}-${{ matrix.architecture }}
          path: umbrel-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Diagnostics
        if: failure()
        run: |
          cat "$RUNNER_TEMP/moinpdf-umbrel-ci-store/server.log" || true
          docker logs --tail 100 moinpdf-umbrel-test || true
          df -h /
          docker system df || true
          docker exec moinpdf-umbrel-test docker info --format 'driver={{.Driver}} root={{.DockerRootDir}}' || true
          docker exec moinpdf-umbrel-test docker system df || true
          docker exec moinpdf-umbrel-test df -h /var/lib/docker /var/lib/containerd /home/umbrel/umbrel || true
          docker exec moinpdf-umbrel-test journalctl -u umbrel --no-pager -n 100 || true
          docker exec moinpdf-umbrel-test docker ps -a || true
          docker exec moinpdf-umbrel-test docker logs --tail 80 denny-moinpdf_web_1 || true
          docker exec moinpdf-umbrel-test docker logs --tail 160 denny-moinpdf_documents_1 || true
          docker exec moinpdf-umbrel-test docker logs --tail 80 denny-moinpdf_website_1 || true
          docker exec moinpdf-umbrel-test docker logs --tail 80 denny-moinpdf_translation-models_1 || true
          docker exec moinpdf-umbrel-test docker logs --tail 80 denny-moinpdf_translation_1 || true
      - name: Remove disposable test host
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/moinpdf-umbrel-ci-store/server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/moinpdf-umbrel-ci-store/server.pid")" || true
          fi
          docker rm -f moinpdf-umbrel-test || true
          docker volume rm moinpdf-umbrel-test || true
          docker volume rm moinpdf-umbrel-docker moinpdf-umbrel-containerd || true
