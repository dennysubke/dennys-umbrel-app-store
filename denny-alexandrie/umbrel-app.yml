description: >-
  Alexandrie is a self-hosted knowledge base and note-taking platform built around an advanced Markdown editor. Organize information across teams, workspaces, categories, and nested documents while keeping your data on your own server.

  Create rich technical notes with LaTeX, diagrams, reusable snippets, interactive elements, file attachments, and synchronized previews. Full-text search, command navigation, Kanban boards, granular permissions, sharing tools, offline support, and ZIP import and export make Alexandrie suitable for both personal knowledge management and collaborative documentation.
