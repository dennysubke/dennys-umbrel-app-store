worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    # Allow nginx to run as UID/GID 1000 with a read-only root filesystem.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        http http;
        https https;
    }

    # Re-resolve the Crafty container after restarts/recreation.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 0;
        client_body_timeout 3600s;

        location / {
            set $crafty_upstream crafty_container:8443;
            proxy_pass https://$crafty_upstream;

            # Only this internal Docker upstream uses a self-signed certificate.
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 60s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_redirect off;

            # Crafty 4.11.0 hardcodes wss:// in base.html. Match the browser's
            # protocol so both HTTP and HTTPS access through Umbrel work.
            proxy_set_header Accept-Encoding "";
            sub_filter "'wss://' + location.host"
                       "(location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host";
        }
    }
}
