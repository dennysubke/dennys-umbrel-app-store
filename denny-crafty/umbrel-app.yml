releaseNotes: >-
  Updated Crafty Controller to 4.11.0 with a pinned multi-architecture image digest. This release adds custom branding improvements and historical log viewing, and includes upstream bug and security fixes.


  Fixed access on umbrelOS 2.0 by routing the web interface through an internal Nginx proxy. The update handles Crafty's self-signed certificate and supports the console's WebSocket connection over both HTTP and HTTPS, along with large file uploads. Existing Minecraft ports and data locations are preserved.
