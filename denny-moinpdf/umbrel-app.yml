category: files & productivity
version: "0.31.3"
port: 8785
description: >-
  ⚓ MoinPDF brings PDF editing, conversion, OCR, and document checks together in one workspace. Merge files, make scans searchable, edit pages, and prepare documents for everyday tasks through a German or English interface. Drag your files into the app, search for what you want to do, and choose the matching tool.


  Key Features:


  📝 Document Creation – Write formatted documents with images and tables, save local drafts, and export PDFs.


  📄 Page Management – Merge, split, rotate, reorder, crop, number, and bookmark PDF pages. Arrange 2, 4, 6, 8, 9, or 16 pages on one sheet with adjustable margins, gaps, and borders while retaining text and vectors. Import and export bookmark outlines as CSV or JSON, review the hierarchy, and choose whether to append or replace existing bookmarks.


  ✏️ PDF Editing – Edit original text in place, compare fonts and the saved result, work with supported images and vector tables, and correct OCR text. Add annotations, highlight passages, change document colors and backgrounds, and work with forms. Supported complete digital text objects can be redacted while retaining remaining text and vectors; unsupported structures receive explicit notices. Scan fonts are approximations.


  🔍 OCR & Scans – Recognize text in multiple languages, create searchable PDFs, improve scans, compress documents, and import images from your camera. Automatically separate photos from a shared scan, correct detected corners or rotation, and export reviewed crops as images or PDFs.


  🔄 File Conversion – Convert supported Office documents locally in your browser or with the included document server. Export PDFs to Word with page sizes, images, and editable text boxes; scans use local OCR, with notices for graphical fallbacks. Convert emails, export images, text, and tables, and create PDF/A files with the document server. Create PDFs locally from Markdown, plain text, CSV, and generic XML. The document server also imports WordPerfect WPD, Works WPS, ODG, DRM-free MOBI/AZW3, EPUB, FB2, CBZ/CBR, XPS, and OXPS, and exports PDFs to RTF, ODT, ODP, and AZW3. Save public website links as PDFs with images, fonts, CSS, and page-layout options using the included website converter.


  🗃️ Data & Comics – Import and export complete QPDF JSON documents, create CBZ comics, export per-page LlamaIndex JSON and structured XML text, inspect embedded PDF JavaScript without running it, and add adjustable scanner effects. Optional CBR creation requires an administrator-provided licensed RAR executable; CBR import and CBZ export work in the standard installation.


  🧮 Document Checks – Compare text, images, numbers, and invoice details, check calculations, and review matching passages in the original document. Check expected documents against a reviewable checklist, inspect scan-quality hints, and compare an original with two edited versions while keeping ambiguous text matches visible.


  🏦 Bank statements to DATEV – Read supported euro statements from Sparkasse, Commerzbank and Volksbank/Raiffeisenbank, including image pages using local OCR. Check balances and postings, choose SKR03 or SKR04, and export a DATEV booking batch. Optional AI account suggestions use a personal OpenAI API key after reviewing the data to send.


  🧾 E-Invoices – Create supported EUR invoices as XRechnung or ZUGFeRD, review the data, and export independently checked invoices with their validation reports. Import supported XML drafts and compare invoice PDFs with embedded XML.


  🏷️ Payment Matching – Review bank postings and receipts, confirm allocations and partial payments, identify missing receipts or overpayments, and export a traceable Excel reconciliation.


  🗂️ PDF Portfolios & Layers – Bundle original PDFs, spreadsheets, emails and images as individually extractable attachments with a contents page and checksums. Create PDF layers and assign supported native objects to them.


  🛡️ Personal Data – Review local suggestions for labeled personal data, email addresses, bank details and tax identifiers, then replace confirmed occurrences with consistent placeholders.


  🖊️ Handwriting – Recognize selected lines of modern German handwriting on the included document server. Correct and confirm each line before exporting text or a searchable PDF. Historical scripts and whole-page recognition are not supported.


  🖨️ Print Preparation – Create PDF/X-3 output with a CMYK profile, trim settings and an independent technical partial-check report. Full ISO conformance is not certified.


  📦 Batch Workflows – Process multiple documents, resume saved workflows, collect receipt fields, and evaluate returned forms. Clear Deck recognizes and groups mixed document piles locally; review assignments, duplicates, and missing pages before exporting individual PDFs or a linked bundle. Save reviewed local recognition rules for recurring layouts and confirm checked, unambiguous suggestions together.


  🧰 Everyday Documents – Remove recurring headers and footers with reviewable matches, fill forms using explicitly saved local profiles, and arrange cropped receipts on A4 sheets for printing. Collect printed dates for a confirmed calendar-file export and replace selected occurrences of identical raster logos. Calendar dates require review; legal deadlines are not calculated.


  📚 Large PDFs – Use the dedicated workspace for rotation, lossless optimization, and OCR with up to 1,000 pages and a maximum file size of 256 MB. Processing runs in verified sections with local checkpoints, cancellation, and resume; every final page is checked before download. Complex document structures are rejected upfront.


  💾 Recovery & Background Jobs – Restore your recent workspace and results from local browser storage. Supported server conversions continue in a persistent queue; jobs and results remain available for 24 hours, including after an app restart.


  🌍 Local Translation – Translate documents on your own server. Scanned PDFs need OCR before text translation.


  🔐 Signatures & Forms – Work with PDF forms, add QR codes, and use certificate-signature tools. Optionally password-encrypt saved projects and archives. Editing a PDF can invalidate existing digital signatures.


  🔊 Read Aloud – Create local narration with German or US-English voices; choose the reading language independently of the interface.


  📖 Built-in Documentation – Find searchable instructions, typical workflows, and guidance for individual tools directly in the app.
