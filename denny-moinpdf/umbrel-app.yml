category: files
version: "0.5.8"
port: 8785
description: >-
  ⚓ MoinPDF brings PDF editing, conversion, OCR, and document checks together in one workspace. Merge files, make scans searchable, edit pages, and prepare documents for everyday tasks through a German-language interface. Drag your files into the app, search for what you want to do, and choose the matching tool.


  The installation includes its own document server and local translation service. Browser tools process files on your device, while server tools use your own instance automatically when you start an action. No external API account, API key entry, or separate document-server setup is required.


  Key Features:


  📄 Page Management – Merge, split, rotate, reorder, crop, number, and bookmark PDF pages.


  ✏️ PDF Editing – Replace text, remove content, add images and annotations, highlight passages, redact information, and work with forms.


  🔍 OCR & Scans – Recognize German and English text, create searchable PDFs, improve scans, compress documents, and import images from your camera.


  🔄 File Conversion – Convert Office documents and emails, export images, text, and tables, and create PDF/A files with the included document server.


  🧮 Document Checks – Compare text, images, numbers, and invoice details, check calculations, and review matching passages in the original document.


  🧾 E-Invoices – Read UBL/CII invoice data, compare invoice PDFs with embedded XML, validate XRechnung files, and use the ZUGFeRD assistant.


  📦 Batch Workflows – Process multiple documents, reuse saved workflows, collect receipt fields, and evaluate returned forms.


  🌍 Local Translation – Translate documents on your own server. Scanned PDFs need OCR before text translation.


  🔐 Signatures & Forms – Work with PDF forms, add QR codes, and use certificate-signature tools. Editing a PDF can invalidate existing digital signatures.


  📖 Built-in Documentation – Find searchable instructions, typical workflows, and guidance for individual tools directly in the app.


  First start: translation models for German, English, French, Spanish, Italian, Dutch, and Polish download automatically. This can take several minutes and requires Internet access. The other tools are available while translation is being prepared. Plan for at least 8 GB of available RAM and 20 GB of free disk space as a starting point.


  Temporary document jobs are removed when processing finishes. Downloaded language models are retained across restarts and updates. Individual tools have document and format limitations; review important results against the original.


  Umbrel login protects the app by default. To publish your own instance through Cloudflare Tunnel, configure the app's access setting deliberately and forward your domain to the app port. The bundled imprint and privacy notice describe Denny Wenke's own deployment; other operators must adapt these details before public use. Camera capture requires HTTPS. Long synchronous server jobs may exceed Cloudflare's request timeout.
