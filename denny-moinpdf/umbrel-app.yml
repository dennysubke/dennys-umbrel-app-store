id: denny-moinpdf
name: MoinPDF
tagline: A complete PDF workspace with local document processing
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-moinpdf/logo.png
category: files & productivity
version: "0.14.5"
port: 8785
description: >-
  ⚓ MoinPDF brings PDF editing, conversion, OCR, and document checks together in one workspace. Merge files, make scans searchable, edit pages, and prepare documents for everyday tasks through a German or English interface. Drag your files into the app, search for what you want to do, and choose the matching tool.


  Key Features:


  📝 Document Creation – Write formatted documents with images and tables, save local drafts, and export PDFs.


  📄 Page Management – Merge, split, rotate, reorder, crop, number, and bookmark PDF pages.


  ✏️ PDF Editing – Replace text, remove content, add images and annotations, highlight passages, redact information, and work with forms.


  🔍 OCR & Scans – Recognize text in multiple languages, create searchable PDFs, improve scans, compress documents, and import images from your camera.


  🔄 File Conversion – Convert supported Office documents locally in your browser or with the included document server. Convert emails, export images, text, and tables, and create PDF/A files with the document server. Save public website links as PDFs with images, fonts, CSS, and page-layout options using the included website converter.


  🧮 Document Checks – Compare text, images, numbers, and invoice details, check calculations, and review matching passages in the original document.


  🧾 E-Invoices – Read UBL/CII invoice data, compare invoice PDFs with embedded XML, validate XRechnung files, and use the ZUGFeRD assistant.


  📦 Batch Workflows – Process multiple documents, reuse saved workflows, collect receipt fields, and evaluate returned forms.


  🌍 Local Translation – Translate documents on your own server. Scanned PDFs need OCR before text translation.


  🔐 Signatures & Forms – Work with PDF forms, add QR codes, and use certificate-signature tools. Editing a PDF can invalidate existing digital signatures.


  📖 Built-in Documentation – Find searchable instructions, typical workflows, and guidance for individual tools directly in the app.
