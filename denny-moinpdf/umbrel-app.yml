releaseNotes: >-
  Updates MoinPDF from 0.14.4 to 0.14.5. Fixes browser-local Office conversion cleanup by terminating the complete worker tree through its owning worker after conversion or cancellation. This prevents native Chromium threads from remaining active and improves repeated conversion and cancellation/restart. Document cleanup, bounded cancellation waits, and local PDF validation are retained. All four service images are updated together and pinned for amd64 and arm64. Full changelog: https://github.com/MoinPDF/moinpdf/blob/v0.14.5/CHANGELOG.en.md
