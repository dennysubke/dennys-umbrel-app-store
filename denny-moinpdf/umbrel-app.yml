id: denny-moinpdf
name: MoinPDF
tagline: A complete PDF workspace with local document processing
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-moinpdf/logo.png
category: files & productivity
version: "0.23.0"
port: 8785
description: >-
  ⚓ MoinPDF brings PDF editing, conversion, OCR, and document checks together in one workspace. Merge files, make scans searchable, edit pages, and prepare documents for everyday tasks through a German or English interface. Drag your files into the app, search for what you want to do, and choose the matching tool.


  Key Features:


  📝 Document Creation – Write formatted documents with images and tables, save local drafts, and export PDFs.


  📄 Page Management – Merge, split, rotate, reorder, crop, number, and bookmark PDF pages.


  ✏️ PDF Editing – Edit original text in place, compare fonts and the saved result, work with supported images and vector tables, and correct OCR text. Add annotations, highlight passages, redact information, and work with forms. Scan fonts are approximations; unsupported layouts receive explicit notices.


  🔍 OCR & Scans – Recognize text in multiple languages, create searchable PDFs, improve scans, compress documents, and import images from your camera.


  🔄 File Conversion – Convert supported Office documents locally in your browser or with the included document server. Export PDFs to Word with page sizes, images, and editable text boxes; scans use local OCR, with notices for graphical fallbacks. Convert emails, export images, text, and tables, and create PDF/A files with the document server. Save public website links as PDFs with images, fonts, CSS, and page-layout options using the included website converter.


  🧮 Document Checks – Compare text, images, numbers, and invoice details, check calculations, and review matching passages in the original document.


  🧾 E-Invoices – Read UBL/CII invoice data, compare invoice PDFs with embedded XML, validate XRechnung files, and use the ZUGFeRD assistant.


  📦 Batch Workflows – Process multiple documents, resume saved workflows, collect receipt fields, and evaluate returned forms. Clear Deck recognizes and groups mixed document piles locally; review assignments, duplicates, and missing pages before exporting individual PDFs or a linked bundle.


  🧰 Everyday Documents – Remove recurring headers and footers with reviewable matches, fill forms using explicitly saved local profiles, and arrange cropped receipts on A4 sheets for printing.


  💾 Recovery & Background Jobs – Restore your recent workspace and results from local browser storage. Supported server conversions continue in a persistent queue; jobs and results remain available for 24 hours, including after an app restart.


  🌍 Local Translation – Translate documents on your own server. Scanned PDFs need OCR before text translation.


  🔐 Signatures & Forms – Work with PDF forms, add QR codes, and use certificate-signature tools. Optionally password-encrypt saved projects and archives. Editing a PDF can invalidate existing digital signatures.


  🔊 Read Aloud – Create local narration with German or US-English voices; choose the reading language independently of the interface.


  📖 Built-in Documentation – Find searchable instructions, typical workflows, and guidance for individual tools directly in the app.
