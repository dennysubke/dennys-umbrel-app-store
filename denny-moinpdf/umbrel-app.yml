releaseNotes: >-
  Updates MoinPDF from 0.20.1 to 0.23.0. Adds Clear Deck for locally recognizing, reviewing, organizing, and exporting mixed document piles; header/footer cleanup; a form helper with saved local profiles; and receipt collection on A4 sheets. Local narration now offers US-English alongside German, independently of the interface language. PDF-to-Word starts locally with separate goals for preserving appearance or editing text and tables. Includes shared export checks, optional encrypted projects, resumable batches, improved compression and OCR corrections, and more responsive previews and mobile text editing. All four services use the published 0.23.0 images pinned by digest for amd64 and arm64. Existing Umbrel data, background jobs, credentials, and port 8785 are preserved. Full changelog: https://github.com/MoinPDF/moinpdf/blob/v0.23.0/CHANGELOG.en.md
