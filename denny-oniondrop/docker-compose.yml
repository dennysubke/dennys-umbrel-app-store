version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: denny-oniondrop_web_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  web:
    image: dennysubke/oniondrop:0.2.0@sha256:498ad346e1f78d86c6d61385455c896a2101342abadab871e86f4cebe8a99caa
    restart: on-failure
    stop_grace_period: 30s
    environment:
      PUID: "1000"
      PGID: "1000"
      ONIONDROP_DATA_DIR: /data
      ONIONDROP_PORT: "8080"
      ONIONDROP_AUTH_MODE: setup
      ONIONDROP_DEFAULT_LANGUAGE: en
      ONIONSHARE_VERSION: "2.6.4"
    volumes:
      - ${APP_DATA_DIR}/data:/data
