releaseNotes: >-
  OnionDrop 0.2.0 is now fully independent from Umbrel and can run on any compatible Docker host, while still offering optional Umbrel integration. The release also adds eight interface languages, an optional built-in login, and an animated Tor connection status display.


  Received files now include SHA-256 checksums, downloadable QR codes, multi-file ZIP downloads, and previews for a wide range of formats. Existing inboxes and persistent OnionShare identities remain compatible and can be migrated from version 0.1.0.
