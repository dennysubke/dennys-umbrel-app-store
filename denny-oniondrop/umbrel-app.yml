releaseNotes: >-
  OnionDrop 0.2.0 is now a fully independent Docker application with support for eight languages, subtle country flags, and an optional built-in login. The release adds an animated Tor connection status, SHA-256 checksums, downloadable QR codes, multi-file ZIP downloads, and previews for a wide range of file formats.


  Clipboard handling has been improved to work reliably in both secure and standard HTTP environments, including private keys and invitation links. Existing inboxes and persistent OnionShare identities remain compatible with the updated version.
