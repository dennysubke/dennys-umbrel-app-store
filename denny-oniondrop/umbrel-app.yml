description: >-
  OnionDrop is a private file-receiving app designed specifically for Umbrel. It uses the official OnionShare engine to create persistent onion inboxes that can be accessed through Tor Browser. Trusted people can upload files or send anonymous text messages without creating an account, revealing their IP address, or relying on a third-party cloud service.


  Each inbox can be configured separately. You can decide whether it accepts files, messages, or both, and optionally protect it with a private access key. Inboxes can also be given an expiration time, a storage limit, and automatic startup so they return online after OnionDrop or Umbrel restarts.


  All received content is stored locally on your own Umbrel. OnionDrop provides a clear interface for managing inboxes, copying invitation details, displaying QR codes, reviewing received files, downloading them, deleting them, and checking the OnionShare service logs.


  Persistent OnionShare receive configurations can also be imported and exported. This allows an existing onion identity to be moved between compatible OnionShare installations and OnionDrop without changing the onion address. OnionDrop combines OnionShare compatibility with a simple, always-available Umbrel interface for private file intake.
