releaseNotes: >-
  This first version of OnionDrop brings persistent OnionShare-compatible inboxes to Umbrel for receiving files and anonymous messages through Tor.


  Each inbox can use a private access key, expiration time, storage limit, and automatic startup after an app restart. The interface includes onion addresses, QR codes, invitation details, received files, downloads, deletion controls, and service logs.


  OnionDrop also supports importing and exporting persistent OnionShare receive configurations while preserving their onion identity. All received content and service data remain stored locally on your Umbrel.
