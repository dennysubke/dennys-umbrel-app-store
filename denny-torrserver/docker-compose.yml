version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: denny-torrserver_app_1
      APP_PORT: 5665
      PROXY_AUTH_ADD: "false"

  app:
    image: ghcr.io/yourok/torrserver:MatriX.144.5@sha256:0db8e8eae5ad80ef0ad1da5f0a3fb95989fdb376bb32337d6872aba1a23c2380
    #network_mode: host
    environment:
      TS_PORT: "5665"
      TS_DONTKILL: "1"
      TS_HTTPAUTH: "0"
      TS_CONF_PATH: /opt/ts/config
      TS_TORR_DIR: /opt/ts/torrents
    volumes:
      - ${APP_DATA_DIR}/data/torrents:/opt/ts/torrents
      - ${APP_DATA_DIR}/data/config:/opt/ts/config



