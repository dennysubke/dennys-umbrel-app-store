description: >-
  Euro-Office is an open-source document editing server for creating, viewing and collaboratively editing text documents, spreadsheets, presentations and PDF files directly in the browser. It supports common Microsoft Office and OpenDocument formats, including DOCX, XLSX, PPTX, ODT, ODS and ODP.


  Euro-Office is designed as an integration component rather than a standalone file manager. Connect it to a supported platform such as Nextcloud, which continues to handle file storage, sharing, permissions and version history. The Euro-Office connector available from the Nextcloud App Store supports Nextcloud 33 through 35.


  This Umbrel package enables JWT authentication, blocks metadata-network access, disables the public example editor and stores the server secrets persistently. Private IP addresses are allowed so Euro-Office can communicate with a Nextcloud instance on the same local network.


  After installation, follow the included README to retrieve the automatically generated JWT secret and connect Euro-Office to Nextcloud. The current upstream container is published for testing and integration purposes, so this package should be considered experimental.
