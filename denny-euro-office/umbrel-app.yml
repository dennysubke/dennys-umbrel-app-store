description: >-
  Euro-Office is a self-hosted document server for editing text documents,
  spreadsheets, presentations, PDFs and forms in the browser. This Umbrel
  package runs the official Euro-Office DocumentServer and includes its bundled
  example interface for standalone testing. For everyday file management it can
  be connected to Nextcloud using the Euro-Office Nextcloud connector. JWT is
  enabled and uses Umbrel's per-install APP_SEED as the secret.
