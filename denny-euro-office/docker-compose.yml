version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: denny-euro-office_server_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/euro-office/documentserver:latest@sha256:889e681923d2dcc8bdfb92fe128d10e185fcff880d302b6a0c0c7bf339499290
    restart: on-failure
    stop_grace_period: 1m
    shm_size: "1gb"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: "${APP_SEED}"
      JWT_HEADER: "AuthorizationJwt"
      JWT_IN_BODY: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "false"
      USE_UNAUTHORIZED_STORAGE: "false"
      EXAMPLE_ENABLED: "false"
      ADMINPANEL_ENABLED: "false"
      PLUGINS_ENABLED: "true"
      GENERATE_FONTS: "true"
      NGINX_ACCESS_LOG: "false"
      NGINX_WORKER_PROCESSES: "1"
    volumes:
      - ${APP_DATA_DIR}/data:/var/www/euro-office/Data
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"
