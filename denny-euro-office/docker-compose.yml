version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: denny-euro-office_web_1
      APP_PORT: 80
      # Required for Nextcloud/other integrations to reach DocumentServer.
      # Euro-Office itself is protected with JWT.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/euro-office/documentserver:v9.3.3@sha256:6068075cc247f9283d337b2cf9a105d9df49fcd8cd6b5e82fa90640df1552e80
    init: true
    restart: on-failure
    stop_grace_period: 2m
    shm_size: "1gb"
    environment:
      # Keeps the bundled browser example available so the Umbrel app can be
      # tested standalone without Nextcloud.
      EXAMPLE_ENABLED: "true"

      # Per-install secret generated by umbrelOS. Retrieve it for Nextcloud with:
      # sudo docker exec denny-euro-office_web_1 printenv JWT_SECRET
      JWT_ENABLED: "true"
      JWT_SECRET: "${APP_SEED}"

      # Needed when Euro-Office has to fetch documents from another service
      # running on the local Umbrel/LAN, e.g. Nextcloud.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "false"

    volumes:
      # Do NOT bind-mount /etc/euro-office. An empty config mount can hide the
      # image-provided local.json and prevent DocumentServer from starting.
      - ${APP_DATA_DIR}/data/lib:/var/lib/euro-office
      - ${APP_DATA_DIR}/data/document-data:/var/www/euro-office/Data
      - ${APP_DATA_DIR}/data/logs:/var/log/euro-office

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
