description: >-
  Pages is a polished static website host for your Umbrel. Browse a dedicated library of nine responsive templates with live previews, create websites in one click, and keep them as private drafts until they are ready to publish. Manage multiple sites from an Umbrel-style overview, upload complete folders or ZIP archives, edit HTML, CSS, JavaScript, JSON, Markdown, and other text files directly in the browser, and preview every change instantly. A dedicated Sharing view provides local, Onion, and custom-domain addresses with open, copy, and locally generated QR-code actions. Each website also includes configurable CORS access, single-page application fallback, directory listings, browser caching, local page-view statistics, ZIP exports, and restorable backups. Pages stores everything locally and serves only pre-built static files without executing uploaded server-side code.
