category: developer tools
version: "0.1.2"
port: 8377
description: >-
  Pages turns your Umbrel into a private, beautifully designed platform for publishing static websites. Start with a professionally crafted template, import an existing project as a ZIP archive, or build a site from scratch by uploading and editing HTML, CSS, JavaScript, JSON, Markdown, and other text-based files directly in your browser. Every change can be reviewed instantly through the integrated live preview.


  A clean dashboard keeps all of your websites organized in one place. Prepare new projects privately as drafts, publish them when they are ready, and share them through your local network, a custom domain, Umbrel’s shared Onion service, or a dedicated persistent Onion address created exclusively for an individual site.


  Pages also includes file management, ZIP exports, restorable backups, page-view statistics, storage insights, QR-code sharing, CORS controls, caching options, and SPA fallback. Whether you are hosting a personal portfolio, documentation, a landing page, a blog, or a Nostr profile, Pages provides everything needed to publish and manage it directly from your Umbrel.


  Your websites, settings, backups, and Onion identities remain stored locally on your Umbrel. Pages serves pre-built static content only and never executes uploaded server-side code.


  ⚙️ Remote Tor access must be enabled in your Umbrel settings for Pages to use Umbrel’s shared Onion address.
