name: Kubo
tagline: A private gateway to the distributed web
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-kubo/logo.png
category: files & productivity
version: "0.42.0"
port: 8396
description: >-
  🧊 Kubo is the most widely used implementation of the InterPlanetary File System, a peer-to-peer protocol for storing, addressing, sharing, and retrieving data across a distributed network.
  
  
  Its integrated web interface provides a clear overview of the node, connected peers, bandwidth activity, repository usage, and pinned content. Files and folders can be imported directly through the browser, assigned content identifiers, organized inside the mutable file system, and pinned locally so that they remain available from this node.
  
  
  Kubo also includes a local HTTP gateway for retrieving IPFS and IPNS content, a full RPC interface for node administration, peer-to-peer connectivity over TCP and QUIC, content routing through the distributed hash table, and tools for managing keys, pins, peers, and repository data.
  
  
  All node data, including the generated peer identity, configuration, imported blocks, pins, and mutable file system, is stored persistently on the Umbrel device.
