description: >-
  🥨 Crumbs turns scattered thoughts into a calm and organized personal knowledge space. Capture quick ideas, detailed notes, tasks, checklists, reference material, and everything in between without losing track of what matters.


  A flexible editor combines Markdown, rich text, tables, code blocks, links, and image attachments, while tags, colors, pinning, search, archives, and version history keep growing collections easy to navigate. Notes can be shared privately or published through read-only links, and the responsive offline-first interface works smoothly across desktop and mobile devices.


  With support for multiple users, secure authentication, API keys, and optional integrations with OAuth, OpenID Connect, email services, and compatible AI assistants, Crumbs is built to grow from a simple notebook into a powerful personal workspace.
