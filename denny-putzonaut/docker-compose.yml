version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: denny-putzonaut_web_1
      APP_PORT: 3080

  web:
    image: ghcr.io/putzonaut/putzonaut:0.22.0-2e02ffd4e844@sha256:980b9781dc3e5f0d382f2b8e27b8aa5dcff99aaed4361727df5a67856cd6e91b
    user: "1000:1000"
    restart: on-failure
    init: true
    entrypoint: [node, /umbrel/entrypoint.mjs]
    environment:
      APP_ORIGIN: "https://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}"
      WEBSITE_ORIGIN: "https://putzonaut.de"
      WEBSITE_PORT: "3081"
      BETTER_AUTH_SECRET: "${APP_SEED}"
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "3080"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      MAIL_FROM: ""
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/hooks/entrypoint.mjs:/umbrel/entrypoint.mjs:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    mem_limit: 768m
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
