manifestVersion: "2.0"
id: denny-putzonaut
storage:
  dataRoot: data
environment:
  - name: APP_ORIGIN
    services: [web]
    note: "HTTPS address used to open Putzonaut and in account emails. For a tunnel, enter its public URL without a trailing slash."
  - name: WEBSITE_ORIGIN
    services: [web]
    default: "https://putzonaut.de"
    note: "Public introduction page on port 3081; canonical HTTPS address without a trailing slash."
  - name: MAIL_FROM
    services: [web]
    default: ""
    note: "Verified sender, for example Putzonaut <info@example.com>."
  - name: SMTP_HOST
    services: [web]
    default: ""
    note: "Mail server; for Brevo use smtp-relay.brevo.com. Add SMTP_PASSWORD as a custom variable for web."
  - name: SMTP_PORT
    services: [web]
    default: "587"
    options: ["587", "465", "2525"]
    note: "587 uses STARTTLS; 465 uses TLS from the start."
  - name: SMTP_USER
    services: [web]
    default: ""
    note: "SMTP login supplied by your mail provider."
category: files & productivity
name: Putzonaut
version: "0.23.0"
tagline: A gamified chore planner for your household
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-putzonaut/logo.png
description: >-
  Make everyday chores a shared mission. Putzonaut helps families, couples, flatmates, and people living alone plan their household, collect stars, and work towards personal or shared rewards. The app interface is in German.


  ⚙️ First start: Open Putzonaut for setup instructions. In Umbrel App Settings, add your verified email sender and SMTP connection. Add the SMTP password as a custom variable for the web service, then apply and restart. An SMTP service is required for account verification and password recovery; no account is created until configuration is complete.


  Use the local HTTPS address or set your own HTTPS domain. For Cloudflare Tunnel, route the domain to http://denny-putzonaut_web_1:3080 and set APP_ORIGIN to the matching public HTTPS address. Users sign in with their own Putzonaut account. The optional introduction page uses port 3081 and WEBSITE_ORIGIN. It remains available while SMTP is being configured.


  Plan recurring chores, use checklists, swap assignments, and complete short cleaning sessions. Collect stars, unlock badges and outfits, track weekly progress, and save wishes as rewards. Adults manage child profiles. Offline completions receive stars after they have synchronized successfully.


  Add Putzonaut to your Android or iPhone home screen as a web app. Enable device reminders to receive a notification at your chosen time, even when the app is closed. Change your login email after confirming the new address, or delete your account after leaving or closing your crew. Accounts, household data, photos, and the encrypted email queue stay in this app's own storage. Internet access is used for your configured SMTP service and, when enabled, your device's push service.
releaseNotes: >-
  Adds reminders while the app is closed, with automatic setup on your server. Under "Konto & Anmeldung", change your login email with your current password and confirmation of the new address, or permanently delete your account after leaving or closing your crew. An email change preserves your crew and progress and signs out existing sessions. Also improves offline startup after installation. Existing accounts, household data, and private app settings are preserved when updating through Umbrel. Open the updated app and enable device reminders on each device where you want notifications.
developer: Putzonaut
website: https://putzonaut.de
dependencies: []
repo: https://github.com/putzonaut/putzonaut
